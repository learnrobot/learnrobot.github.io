<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robots Near Me | LearnRobot</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #1a1a1a; overflow: hidden;
        }
        #robot-map { 
            width: 100%; height: 100vh; 
        }
        
        /* 메인 화면으로 돌아가는 예쁜 네온 버튼 */
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 9999;
            background: rgba(0, 230, 118, 0.15); backdrop-filter: blur(6px);
            color: #00E676; border: 2px solid #00E676; padding: 12px 24px;
            border-radius: 30px; font-family: 'Orbitron', sans-serif; font-weight: 700;
            text-decoration: none; transition: all 0.3s ease; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .back-btn:hover { 
            background: #00E676; color: #0b0d10; 
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.6); transform: scale(1.05); 
        }
    </style>
</head>
<body>

    <!-- 돌아가기 버튼 -->
    <a href="index.html" class="back-btn">← MAIN HUD</a>

    <!-- 지도가 꽉 차게 그려질 영역 -->
    <div id="robot-map"></div>

    <!-- 구글 맵스 API 호출 -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsZVwJOkrcl0W1uCUxasm9GbJV5zuKQSE&libraries=places&callback=initMap" async defer></script>
    
    <script>
    let map;
    let infowindow;

    function initMap() {
        const defaultLocation = { lat: 37.5665, lng: 126.9780 }; 
        map = new google.maps.Map(document.getElementById("robot-map"), {
            center: defaultLocation,
            zoom: 13,
            disableDefaultUI: true, // 복잡한 구글 기본 버튼들 숨기기
            zoomControl: true, // 줌인/줌아웃 버튼만 살리기
            styles: [ 
                { "elementType": "geometry", "stylers": [{ "color": "#212121" }] }, 
                { "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                { "elementType": "labels.text.stroke", "stylers": [{ "color": "#212121" }] },
                { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#000000" }] },
                // 🚨 방해되는 일반 장소(상가, 병원, 공원 등) 아이콘 전부 끄기
                { "featureType": "poi", "elementType": "labels.icon", "stylers": [{ "visibility": "off" }]},
                { "featureType": "transit", "elementType": "labels.icon", "stylers": [{ "visibility": "off" }]}
            ]
        });

        infowindow = new google.maps.InfoWindow();

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
                    map.setCenter(pos);
                    searchRobotsNear(pos);
                },
                () => {
                    searchRobotsNear(defaultLocation);
                }
            );
        }
    }

    function searchRobotsNear(location) {
        const request = {
            location: location,
            radius: '5000',
            keyword: '로봇' // 검색어를 '로봇' 하나로 단순화하여 정확도 상승
        };
        const service = new google.maps.places.PlacesService(map);
        service.nearbySearch(request, (results, status) => {
            if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                for (let i = 0; i < results.length; i++) {
                    createMarker(results[i]);
                }
            }
        });
    }

    function createMarker(place) {
        if (!place.geometry || !place.geometry.location) return;
        const marker = new google.maps.Marker({
            map, position: place.geometry.location,
            icon: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'
        });
        google.maps.event.addListener(marker, "click", () => {
            infowindow.setContent(`
                <div style="color: #000; padding: 10px; font-family: 'Roboto', sans-serif;">
                    <strong style="font-size: 1.2rem; color: #2C9999;">${place.name}</strong><br>
                    <span style="font-size: 0.95rem; color: #555;">${place.vicinity}</span>
                </div>
            `);
            infowindow.open(map, marker);
        });
    }
    </script>
</body>
</html>
